sofia.version=0.0.3
spring.application.name=sofia
server.port=9595
server.servlet.context-path=/sofia

# Common configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Local development specific configurations
spring.config.import=optional:file:.env.local
spring.datasource.url=jdbc:postgresql://jskn.iptime.org:5432/kdy987_db?currentSchema=sofia
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT secret from environment
jwt.secret=${JWT_SECRET:sofia2-9a4f2c8d3b7a1e5f8g2h6j1k9l0m4n3o2p5q8r7s6t9u0v1w2x3y4z5a6b7c8d9e}

# Default values if not overridden
sofia.base.folder=./data
jwt.expiration=25200000

# Jackson settings
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false
